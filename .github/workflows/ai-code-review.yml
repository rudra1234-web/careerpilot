name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Review this pull request in ${{ github.repository }}. Focus on:
            - Bugs and logic errors
            - Security issues
            - Performance problems
            - Code quality and readability
            - Missing tests or error handling

            Post inline comments for specific issues and one summary
            comment. Be concise and skip trivial style nitpicks.
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 8
            --allowedTools "mcp_github_inline_comment_create_inline_comment,Bash(gh pr comment:),Bash(gh pr diff:),Bash(gh pr view:*)"
