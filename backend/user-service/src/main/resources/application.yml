server:
  port: 8081
spring:
  application:
    name: user-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/careerpilot
    username: careerpilot
    password: careerpilot
    hikari:
      # sized for concurrency: default is 10; with virtual threads the
      # bottleneck moves to the pool, so give it more headroom
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      # 'none': schema already exists; with 'update' Hibernate must reach the
      # DB during startup and the service dies if Postgres is still booting.
      ddl-auto: none
    # Pin the dialect so Hibernate does NOT need a live DB connection at
    # startup; the service now boots even if Postgres is still coming up
    # and connects once it is available (instead of dying at boot).
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/careerpilot

# --- Distributed tracing (Micrometer -> Zipkin) ---
management:
  endpoints:
    web:
      exposure:
        include: health,info
  tracing:
    sampling:
      probability: 1.0     # trace everything in dev; lower (0.1) in prod
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

spring.kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    group-id: user-service
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    properties:
      spring.json.trusted.packages: "*"
