server:
  port: 8083
spring:
  application:
    name: resume-service
  threads:
    virtual:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/careerpilot
  servlet:
    multipart:
      max-file-size: 5MB

ai:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-sonnet-5

resume:
  storage-dir: ${RESUME_STORAGE_DIR:./resume-uploads}

# --- Distributed tracing (Micrometer -> Zipkin) ---
management:
  tracing:
    sampling:
      probability: 1.0     # trace everything in dev; lower (0.1) in prod
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans

spring.kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
