server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates: [Path=/api/users/**]
        - id: question-service
          uri: http://localhost:8082
          predicates: [Path=/api/questions/**]
        - id: resume-service
          uri: http://localhost:8083
          predicates: [Path=/api/resumes/**]
        - id: progress-service
          uri: http://localhost:8084
          predicates: [Path=/api/progress/**]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/careerpilot

# --- Distributed tracing (Micrometer -> Zipkin) ---
management:
  tracing:
    sampling:
      probability: 1.0     # trace everything in dev; lower (0.1) in prod
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
